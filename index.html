<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VRC人生ゲーム</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2026.10.22-b">
</head>
<body>
<script>window.APP_VER="2026.10.22-b"</script>
<section id="setup"></section>
<main id="game" hidden>
  <div id="turn"></div>
  <div id="boardwrap"><div id="board"></div></div>
  <aside id="panel">
    <div id="event"><div id="evh"></div><div id="msg"></div></div>
    <div class="ctl"><div id="dice">🎲</div><button id="roll" class="big">サイコロを振る</button></div>
    <div id="route"></div><div id="items"></div>
    <div id="stat"></div><div id="tip" hidden></div>
    <details id="legend"><summary>📖 アイコンの見かた</summary><div id="legendBody"></div></details>
    <button id="editme" hidden>✏️ 名前・写真を変更</button>
  </aside>
  <aside id="logbox"><h3>📜 ログ</h3><ol id="log"></ol></aside>
</main>
<dialog id="result"></dialog>
<dialog id="prof"></dialog>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="js/data.js?v=2026.10.22-b"></script>
<script src="js/ui.js?v=2026.10.22-b"></script>
<script src="js/net.js?v=2026.10.22-b"></script>
<script src="js/game.js?v=2026.10.22-b"></script>
<script src="js/main.js?v=2026.10.22-b"></script>
</body>
</html>
